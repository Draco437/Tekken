<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TEKKEN BRAWL: Ogre vs Princess</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600;800;900&family=Rajdhani:wght@600;700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
        }

        body {
            background-color: #0a0810;
            color: #ffffff;
            font-family: 'Rajdhani', sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            overflow: hidden;
        }

        #game-container {
            position: relative;
            width: 960px;
            height: 540px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.8), 0 0 30px rgba(0, 240, 120, 0.2);
            border-radius: 8px;
            overflow: hidden;
            border: 2px solid #2d2841;
            background: #0e0c16;
        }

        canvas {
            display: block;
            width: 100%;
            height: 100%;
        }

        .controls-bar {
            margin-top: 14px;
            display: flex;
            gap: 24px;
            font-size: 13px;
            color: #a0a4b8;
            background: rgba(22, 20, 34, 0.85);
            padding: 8px 20px;
            border-radius: 20px;
            border: 1px solid #2d2841;
            backdrop-filter: blur(8px);
        }

        .controls-bar span {
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .key-badge {
            background: #1d1a2f;
            border: 1px solid #4a4568;
            color: #00f078;
            padding: 2px 6px;
            border-radius: 4px;
            font-weight: bold;
            font-size: 11px;
            font-family: 'Orbitron', monospace;
        }

        .key-badge.p2 {
            color: #ff288c;
        }
    </style>
</head>
<body>
    <div id="game-container">
        <canvas id="gameCanvas" width="960" height="540"></canvas>
    </div>

    <div class="controls-bar">
        <span><strong style="color:#00f078;">P1 (OGRE):</strong> <span class="key-badge">W,A,S,D</span> Move/Guard | <span class="key-badge">G</span> Attack | <span class="key-badge">L-Shift</span> Dash | <span class="key-badge">F</span> Super</span>
        <span><strong style="color:#ff288c;">P2 (PRINCESS):</strong> <span class="key-badge p2">ARROWS</span> Move/Guard | <span class="key-badge p2">L</span> Attack | <span class="key-badge p2">R-Ctrl</span> Dash | <span class="key-badge p2">K</span> Super</span>
        <span><span class="key-badge" style="color:#ffd21e;">P/ESC</span> Pause</span>
    </div>

    <script src="game.js"></script>
</body>
</html>
